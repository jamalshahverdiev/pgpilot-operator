apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pgpilot-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller-manager
    {{- include "pgpilot-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if not .Values.leaderElection.enabled }}
  # Without leader election nothing keeps two operator pods from working at
  # the same time, and a rolling update runs the old and the new one side by
  # side until the new one is ready.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      control-plane: controller-manager
      {{- include "pgpilot-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        {{- include "pgpilot-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pgpilot-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: {{ include "pgpilot-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            - --health-probe-bind-address={{ .Values.healthProbe.bindAddress }}
            {{- with .Values.credentials.recheckInterval }}
            - --credentials-recheck-interval={{ . }}
            {{- end }}
            {{- /* A number from a values file, --set-json or the stored values of a
                   release is a float, which prints as 1.00068e+09. */}}
            {{- $rawRunAsUser := dig "runAsUser" "" (.Values.collector | default dict) }}
            {{- $runAsUser := toString $rawRunAsUser }}
            {{- if and (kindIs "float64" $rawRunAsUser) (eq (floor $rawRunAsUser) $rawRunAsUser) }}
            {{- $runAsUser = printf "%.0f" $rawRunAsUser }}
            {{- end }}
            {{- if and (ne $runAsUser "") (ne $runAsUser "auto") }}
            {{- $isUser := and (regexMatch "^[1-9][0-9]{0,9}$" $runAsUser) (le (int64 $runAsUser) 2147483647) }}
            {{- if not (or (eq $runAsUser "none") $isUser) }}
            {{- fail (printf "collector.runAsUser must be a user ID from 1 to 2147483647, \"none\" or \"auto\", got %q" $runAsUser) }}
            {{- end }}
            - --collector-run-as-user={{ $runAsUser }}
            {{- end }}
            {{- $storedImageTag := toString (dig "storedImageTag" true (.Values.migrations | default dict)) }}
            {{- if eq $storedImageTag "false" }}
            - --migrate-stored-image-tag=false
            {{- else if ne $storedImageTag "true" }}
            {{- fail (printf "migrations.storedImageTag must be true or false, got %q" $storedImageTag) }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:8443
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            {{- if .Values.metrics.secure }}
            - --metrics-secure=true
            {{- else }}
            - --metrics-secure=false
            {{- end }}
          ports: []
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: []
      volumes: []
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
