replicaCount: 1

image:
  repository: jamalshahverdiev/pgpilot-operator
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

leaderElection:
  enabled: true

# Install and upgrade the pgpilot.io CRDs as part of this release. They carry
# `helm.sh/resource-policy: keep`, so `helm uninstall` never deletes them (and
# with them every PgpilotMonitor in the cluster). Set to false to manage the
# CRDs yourself:
#   kubectl apply --server-side --force-conflicts -f charts/pgpilot-operator/files/crds/
installCRDs: true

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

metrics:
  enabled: true
  secure: true

healthProbe:
  bindAddress: ":8081"
