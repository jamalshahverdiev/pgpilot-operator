replicaCount: 1

image:
  repository: jamalshahverdiev/pgpilot-operator
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

leaderElection:
  enabled: true

# Install and upgrade the pgpilot.io CRDs as part of this release. They carry
# `helm.sh/resource-policy: keep`, so `helm uninstall` never deletes them (and
# with them every PgpilotMonitor in the cluster). Set to false to manage the
# CRDs yourself:
#   kubectl apply --server-side --force-conflicts -f charts/pgpilot-operator/files/crds/
installCRDs: true

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

metrics:
  enabled: true
  secure: true

healthProbe:
  bindAddress: ":8081"

migrations:
  # Operator releases up to v1.0.2 wrote the pgwatch image tag of the time
  # (5.1.0) into the spec of every monitor they reconciled, which would keep
  # those monitors on that version for good. With this on, the operator
  # removes that tag once at start, and only where the API server's record
  # shows no other writer for it. To keep 5.1.0 on one monitor, annotate it
  # with pgpilot.io/keep-image-tag: "true" before upgrading; turn this off to
  # leave every stored tag as it is.
  storedImageTag: true

credentials:
  # How often the Secret referenced by a PgpilotMonitor is read again. The
  # operator does not watch Secrets; a changed Secret is noticed at the next
  # recheck and the collector pod is then replaced. A Go duration of at least
  # 10s, e.g. "1m". Empty uses the operator's default of 5m.
  recheckInterval: ""
