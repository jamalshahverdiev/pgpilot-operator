name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + envtest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The chart tests under test/chart render the Helm chart.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Run tests
        run: make test

      # `make test` regenerates CRDs, RBAC, deepcopy code and the chart's CRD
      # copy. Anything it changes or creates was committed stale or not at all.
      - name: Check generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::generated files are out of date; run 'make manifests generate fmt' and commit the result"
            exit 1
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: cover.out

  # The generated configuration, run by the pgwatch release the operator
  # deploys, against a real PostgreSQL. This is the job that tells whether a
  # change to the builders or a new pgwatch version still collects metrics.
  collector:
    name: Real pgwatch collector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest PostgreSQL pgwatch has metric definitions for, the last one
        # before its PostgreSQL 19 definitions, and 19.
        postgres: ["14", "18", "19"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run the collector tests
        run: make test-collector COLLECTOR_TEST_POSTGRES=postgres:${{ matrix.postgres }}
