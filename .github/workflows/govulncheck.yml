name: Vulnerabilities

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:00 UTC: new advisories appear without any change to the code.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Reports only vulnerabilities in code the operator can actually reach,
      # in its dependencies and in the Go standard library of go.mod.
      - name: Run govulncheck
        run: make govulncheck
