                        and ending with an alphanumeric character'
                      rule: self.all(k, k.matches('^([a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$')
                        && k.indexOf('/') <= 253)
                    - message: label keys under pgpilot.io/ are reserved for the operator
                      rule: '!self.exists(k, k.startsWith(''pgpilot.io/''))'
                type: object
              sinks:
                description: |-
                  sinks configures where measurements go. At least one sink must be
                  enabled.
                properties:
                  grpc:
                    description: |-
                      grpc configures the push-based gRPC sink. pgpilot-operator does
                      not ship a receiver — this is a pass-through for users that run
                      their own, or for future pgpilot action-operators.
                    properties:
                      enabled:
                        default: false
                        description: enabled toggles the sink.
                        type: boolean
                      endpoint:
                        description: |-
                          endpoint is the host:port of the gRPC Receiver. Required when the
                          sink is enabled.
                        maxLength: 512
                        pattern: ^\S*$
                        type: string
                      tls:
                        description: |-
                          tls makes the collector connect to the Receiver with TLS. Without
                          it, or without a caSecretRef in it, the connection is plaintext.
                        properties:
                          caSecretRef:
                            description: |-
                              caSecretRef is the name of a Secret in the same namespace that
                              contains, under the key "ca.crt", the certificate authority the
                              Receiver's certificate has to be signed by. Naming it is what turns
                              TLS on: the collector then refuses a Receiver whose certificate that
                              authority did not sign, or that is not for the host in endpoint. The
                              pod mounts the Secret read-only and is replaced when it changes.

                              The field has no validation of its own: it was stored, and did
                              nothing, before it had a meaning, and a rule added now would refuse
                              writes to such monitors. The operator reports a value that is not
                              the name of a Secret.
                            type: string
                        type: object
                    required:
                    - enabled
                    type: object
                    x-kubernetes-validations:
                    - message: endpoint is required when the gRPC sink is enabled
                      rule: '!self.enabled || (has(self.endpoint) && size(self.endpoint)
                        > 0)'
                  prometheus:
                    default:
                      enabled: true
                    description: |-
                      prometheus configures the pull-based Prometheus sink (pgwatch
                      exposes /metrics on the pod). It is enabled when the field is left
                      out; set `enabled: false` to run with the gRPC sink only.
                    properties:
                      enabled:
                        default: true
                        description: enabled toggles the sink.
                        type: boolean
                      port:
                        default: 9187
                        description: port the pgwatch process listens on for /metrics.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - enabled
                    type: object
                type: object
                x-kubernetes-validations:
                - message: at least one sink must be enabled
                  rule: (has(self.prometheus) && self.prometheus.enabled) || (has(self.grpc)
                    && self.grpc.enabled)
            required:
            - database
            - metrics
            - sinks
            type: object
          status:
            description: status defines the observed state of PgpilotMonitor
            properties:
              conditions:
                description: |-
                  conditions reflects the current state of the PgpilotMonitor.
                    - "Ready" — the pgwatch Pod of the current spec is running and
                      available. When False, the reason says what is in the way
                      (RolloutInProgress, ImagePullBackOff, CrashLoopBackOff,
                      PodCreateFailed, SecretNotFound, InvalidPreset, ...). It says
                      nothing about the database: see CredentialsAvailable.
                    - "ConfigGenerated" — the ConfigMap matches the spec. Unknown when
                      the reconcile did not get as far as rendering it.
                    - "CredentialsAvailable" — inline credentials are set, or the
                      referenced Secret exists and has a value under both keys. Whether
                      the database accepts them is not checked: pgwatch keeps retrying,
                      and the pgwatch_instance_up metric tells.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configHash:
                description: |-
                  configHash is the SHA-256 digest of the rendered sources.yaml +
                  metrics.yaml payload. A change here means the underlying pgwatch
                  Deployment has been (or will be) rolled.
                type: string
              lastReconciled:
                description: |-
                  lastReconciled is when the operator last changed this status. It is
                  not a heartbeat: a reconcile that finds everything as it was writes
                  nothing.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the .metadata.generation the status describes.
                  It is written on every reconcile, also on one that could not apply
                  the spec; the Ready condition tells which.
                format: int64
                type: integer
              podName:
                description: |-
                  podName is the name of a pgwatch Pod that runs now: a ready one if
                  there is one, otherwise the newest. Empty when none runs.
                type: string
              ready:
                description: |-
                  ready is true when the pgwatch Pod of the current spec is running
                  and available, i.e. the rollout of the generated Deployment has
                  completed. While a changed spec is rolled out, or cannot be, it is
                  false even though the Pod of the previous spec keeps collecting. It
                  always says what the Ready condition says, and is always written, so
                  `false` shows up in `kubectl get` instead of an empty column.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
