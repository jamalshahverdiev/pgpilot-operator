---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: pgpilotmonitors.pgpilot.io
spec:
  group: pgpilot.io
  names:
    kind: PgpilotMonitor
    listKind: PgpilotMonitorList
    plural: pgpilotmonitors
    shortNames:
    - pm
    singular: pgpilotmonitor
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.podName
      name: Pod
      priority: 1
      type: string
    - jsonPath: .spec.database.host
      name: Host
      priority: 1
      type: string
    - jsonPath: .spec.database.database
      name: DB
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          PgpilotMonitor declares that pgpilot-operator should run a pgwatch
          collector against the described PostgreSQL database and expose its
          metrics via the configured sinks. It is namespace-scoped and users may
          create any number of them in any namespace.

          The name is used to derive the names of the generated Service, Deployment
          and ConfigMap ("pgpilot-<name>") and as a label value. Keep it to at most
          55 characters without dots; with a longer or dotted name the Service cannot
          be created.

          This is deliberately not a validation rule on the object: a rule on
          metadata.name is evaluated on every update, the name can never be changed,
          and so a monitor that already exists with such a name could no longer be
          updated at all - not even to remove its finalizer when it is deleted.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PgpilotMonitor
            properties:
              database:
                description: database is the PostgreSQL target pgwatch will monitor.
                properties:
                  credentialsSecret:
                    description: |-
                      credentialsSecret references a Secret in the same namespace that
                      holds the connection credentials. Preferred over inline username/
                      password.
                    properties:
                      name:
                        description: |-
                          name of the Secret. It has to be a valid Secret name: lower-case
                          letters, digits, '-' and '.', starting and ending with a letter or
                          digit.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      passwordKey:
                        default: password
                        description: |-
                          passwordKey is the key inside the Secret containing the database
                          password. Defaults to "password".
                        maxLength: 253
                        pattern: ^[-._a-zA-Z0-9]*$
                        type: string
                      usernameKey:
                        default: username
                        description: |-
                          usernameKey is the key inside the Secret containing the database
                          username. Defaults to "username".
                        maxLength: 253
                        pattern: ^[-._a-zA-Z0-9]*$
                        type: string
                    required:
                    - name
                    type: object
                  customTags:
                    additionalProperties:
                      type: string
                    description: |-
                      customTags are added to every measurement as additional labels.
                      Useful for `env`, `team`, `tier`, etc. Passed through to pgwatch
                      source configuration verbatim.

                      Keys become label names. On the Prometheus sink a character outside
                      `[a-zA-Z0-9_]` is exported as `_` (`team-name` becomes `team_name`),
                      so prefer plain label names. Three kinds of key cannot work and are
                      rejected: an empty key, a key starting with `__` (reserved by
                      Prometheus; pgwatch then fails to export every series of the
                      database) and `dbname`, which pgwatch sets to the monitor name.

                      The operator adds the tag `namespace`, the namespace of the monitor,
                      to every source. A `namespace` key set here is replaced by it.
                    maxProperties: 32
                    type: object
                    x-kubernetes-validations:
                    - message: customTags keys must not be empty, must not start with
                        __ and must not be dbname
                      rule: self.all(k, size(k) > 0 && !k.startsWith('__') && k !=
                        'dbname')
                  database:
                    description: |-
                      database is the logical database name pgwatch connects to.
                      PostgreSQL limits identifiers to 63 bytes.
                    maxLength: 63
                    minLength: 1
                    type: string
                  host:
                    description: |-
                      host of the PostgreSQL server: a DNS name, an IPv4 address or an IPv6
                      address (with or without square brackets). The port goes into `port`,
                      not here, and characters that have a meaning in a connection URL are
                      not accepted.
                    maxLength: 253
                    minLength: 1
                    pattern: ^([A-Za-z0-9._-]+|\[?[0-9A-Fa-f]*:[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*\]?)$
                    type: string
                  password:
                    description: |-
                      password is the database password. See the note on `username` — only
                      suitable for dev/test.
                    minLength: 1
                    type: string
                  port:
                    default: 5432
                    description: port of the PostgreSQL server.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  sslmode:
                    default: disable
                    description: sslmode selects TLS behaviour (libpq sslmode semantics).
                    enum:
                    - disable
                    - allow
                    - prefer
                    - require
                    - verify-ca
                    - verify-full
                    type: string
                  tls:
                    description: |-
                      tls names the certificates for the connection: the certificate
                      authority the server's certificate is checked against, and a client
                      certificate for a server that asks for one. Whether TLS is used at
                      all, and how strictly the server is checked, is what sslmode says,
                      which is "disable" unless it is set: certificates are refused with
                      an sslmode that would leave them unused.
                    properties:
                      caSecretRef:
                        description: |-
                          caSecretRef names the Secret with the certificate authority (one or
                          more PEM certificates) that the server's certificate has to be signed
                          by. It is what sslmode verify-ca and verify-full check against;
                          without it they go by the certificate authorities of the pgwatch
                          image, which are the public ones and know nothing of a private CA.
                          With sslmode require it makes the collector check the certificate
                          as verify-ca does.
                        properties:
                          key:
                            default: ca.crt
                            description: |-
                              key inside the Secret that holds the PEM certificates. Defaults to
                              "ca.crt".
                            maxLength: 253
                            pattern: ^[-._a-zA-Z0-9]*$
                            type: string
                          name:
                            description: name of the Secret.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - name
                        type: object
                      clientCertSecretRef:
                        description: |-
                          clientCertSecretRef names the Secret with a client certificate and
                          its private key, for a server that asks for one (pg_hba.conf method
                          "cert", or clientcert=verify-full). A Secret of type
                          kubernetes.io/tls has the keys this expects by default.
                        properties:
                          certKey:
                            default: tls.crt
                            description: |-
                              certKey is the key inside the Secret that holds the PEM certificate.
                              Defaults to "tls.crt".
                            maxLength: 253
                            pattern: ^[-._a-zA-Z0-9]*$
                            type: string
                          keyKey:
                            default: tls.key
                            description: |-
                              keyKey is the key inside the Secret that holds the PEM private key,
                              not encrypted. Defaults to "tls.key".
                            maxLength: 253
                            pattern: ^[-._a-zA-Z0-9]*$
                            type: string
                          name:
                            description: name of the Secret.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                  username:
                    description: |-
                      username is the database user. Prefer credentialsSecret for production
                      — values set here are part of this object, stored in etcd in clear
                      text and readable by everyone who may read it. The operator hands them
                      to the collector through a Secret it generates,
                      pgpilot-<name>-credentials.
                    minLength: 1
                    type: string
                required:
                - database
                - host
                type: object
                x-kubernetes-validations:
                - message: set either inline username+password or credentialsSecret,
                    not both (and not neither)
                  rule: (has(self.username) && has(self.password)) != has(self.credentialsSecret)
                - message: password is required when username is set inline
                  rule: '!has(self.username) || has(self.password)'
                - message: username is required when password is set inline
                  rule: '!has(self.password) || has(self.username)'
                - message: 'tls.caSecretRef needs sslmode require, verify-ca or verify-full:
                    with any other the server''s certificate is not checked against
                    it'
                  rule: '!has(self.tls) || !has(self.tls.caSecretRef) || (has(self.sslmode)
                    && self.sslmode in [''require'', ''verify-ca'', ''verify-full''])'
                - message: 'tls.clientCertSecretRef needs an sslmode other than disable:
                    a connection without TLS presents no certificate'
                  rule: '!has(self.tls) || !has(self.tls.clientCertSecretRef) || (has(self.sslmode)
                    && self.sslmode != ''disable'')'
              image:
                description: image overrides the pgwatch image coordinates.
                properties:
                  pullPolicy:
                    default: IfNotPresent
                    description: |-
                      pullPolicy of the pgwatch container. The default also holds for the
                      tag "latest", which Kubernetes would otherwise pull at every start.
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  repository:
                    description: |-
                      repository of the pgwatch image. Leave empty for the operator's
                      default, cybertecpostgresql/pgwatch.
                    type: string
                  tag:
                    description: |-
                      tag of the pgwatch image. Leave empty to run the pgwatch release this
                      operator version is built for; that is the recommended setting, since
                      the names of the presets are checked against that release, and the
                      metric definitions the operator hands to a collector with metrics of
                      its own come from it. A tag set here is kept across operator upgrades.
                    type: string
                type: object
              metrics:
                description: metrics selects what pgwatch collects.
                properties:
                  custom:
                    description: |-
                      custom is an inline list of metric definitions. Prefer libraries for
                      anything reused across monitors. Metric names must be unique within
                      the list.
                    items:
                      description: |-
                        MetricDefinition describes one pgwatch SQL metric. It is the unit shared
                        between PgpilotMetricLibrary (reusable sets) and PgpilotMonitor.spec.metrics.custom
                        (inline one-offs). The operator merges these with the pgwatch built-in
                        preset selected by the user and materialises a metrics.yaml for pgwatch.
                      properties:
                        description:
                          description: description is a free-form human-readable hint.
                            Not used by pgwatch.
                          type: string
                        gauges:
                          description: |-
                            gauges lists the result columns treated as gauges (vs counters).
                            Use ["*"] to mark every non-tag column as a gauge — this matches
                            how pgwatch built-in metrics are written.
                          items:
                            type: string
                          type: array
                        interval:
                          description: |-
                            interval is the collection period as a Go duration (e.g. "30s", "5m",
                            "1h"). pgwatch schedules in whole seconds, so fractions are truncated;
                            the minimum is 1s. If omitted, the operator uses 60s, or, for a
                            metric that replaces one of the monitor's preset by name, the
                            interval the preset collects it at.
                          type: string
                          x-kubernetes-validations:
                          - message: interval must be a duration of at least 1s, e.g.
                              30s, 5m or 1h
                            rule: duration(self) >= duration('1s')
                        isInstanceLevel:
                          description: isInstanceLevel marks the metric as instance-wide
                            (not database-scoped).
                          type: boolean
                        masterOnly:
                          description: |-
                            masterOnly restricts collection to primary PostgreSQL instances.
                            Cannot be combined with standbyOnly.
                          type: boolean
                        name:
                          description: |-
                            name is the pgwatch metric name. Used as the key in metrics.yaml and
                            as the series name when shipped to Prometheus / gRPC sinks.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z_][a-z0-9_]*$
                          type: string
                        sqls:
                          additionalProperties:
                            type: string
                          description: |-
                            sqls maps a PostgreSQL major version to the SQL statement pgwatch
                            executes from that version on. For a given server pgwatch picks the
                            entry with the highest key that is not above the server's major
                            version, so "14" covers 14 and everything newer until a higher key
                            is defined, and "0" covers every version. A server older than the
                            lowest key gets no data for the metric.

                            Keys are major versions written as plain integers in strings ("0",
                            "14"), not server_version_num values such as 170000, and there is no
                            wildcard key. Statements must not be empty.
                          maxProperties: 32
                          minProperties: 1
                          type: object
                          x-kubernetes-validations:
                          - message: sqls keys must be PostgreSQL major versions written
                              as plain integers, e.g. "14" ("0" matches every version)
                            rule: self.all(k, k.matches('^(0|[1-9][0-9]{0,2})$'))
                          - message: sqls statements must not be empty
                            rule: self.all(k, size(self[k]) > 0)
                        standbyOnly:
                          description: |-
                            standbyOnly restricts collection to standby (replica) instances.
                            Cannot be combined with masterOnly.
                          type: boolean
                        statementTimeoutSeconds:
                          description: |-
                            statementTimeoutSeconds is accepted for compatibility and ignored.

                            Deprecated: pgwatch has no configurable per-metric timeout, so the
                            value was never applied. From pgwatch 6 on the collector cancels
                            metric queries on its own: those due together after 30 seconds, and
                            one retried alone after its interval (at least 30 seconds). For a
                            limit of your choosing set it on the database side, e.g.
                            `ALTER ROLE <monitoring role> SET statement_timeout = '5s'`.
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                      - name
                      - sqls
                      type: object
                      x-kubernetes-validations:
                      - message: masterOnly and standbyOnly are mutually exclusive
                        rule: '!(has(self.masterOnly) && self.masterOnly && has(self.standbyOnly)
                          && self.standbyOnly)'
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: metric names must be unique
                      rule: self.all(x, self.exists_one(y, y.name == x.name))
                  fromLibraries:
                    description: |-
                      fromLibraries references PgpilotMetricLibrary CRs in the same
                      namespace whose metrics should be included. A library can be listed
                      only once.
                    items:
                      description: |-
                        LibraryRef points to a PgpilotMetricLibrary in the same namespace.
                        Cross-namespace references are intentionally not supported in v1.0.0.
                      properties:
                        name:
                          description: name of the PgpilotMetricLibrary.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: a library can be listed only once
                      rule: self.all(x, self.exists_one(y, y.name == x.name))
                  preset:
                    description: |-
                      preset is the name of a pgwatch built-in preset (e.g. "basic",
                      "standard", "exhaustive", "recommendations", "rds", "aurora").
                      Leave empty to rely entirely on libraries and custom metrics.
                      A name pgwatch does not know, or one of its presets for sources
                      other than PostgreSQL ("patroni", "pgbouncer", "pgpool"), is
                      reported in the monitor's status and no collector configuration is
                      generated for it.
                    maxLength: 63
                    pattern: ^([a-z][a-z0-9_]*)?$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: at least one of preset, fromLibraries or custom must be
                    set
                  rule: (has(self.preset) && size(self.preset) > 0) || (has(self.fromLibraries)
                    && size(self.fromLibraries) > 0) || (has(self.custom) && size(self.custom)
                    > 0)
              podMetadata:
                description: |-
                  podMetadata extends labels and annotations on the generated Pod
                  template. Used for vmagent / Prometheus annotation-based discovery
                  (e.g. prometheus.io/scrape), team ownership, etc.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      annotations to add on top of system-managed annotations. Keys must be
                      valid Kubernetes annotation keys.
                    maxProperties: 64
                    type: object
                    x-kubernetes-validations:
                    - message: 'annotation keys must be valid Kubernetes annotation
                        keys: an optional DNS subdomain prefix and ''/'', then at
                        most 63 alphanumeric characters, ''-'', ''_'' or ''.'', starting
                        and ending with an alphanumeric character'
                      rule: self.all(k, k.matches('^([A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?([.][A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$')
                        && k.indexOf('/') <= 253)
                    - message: annotation keys under pgpilot.io/ are reserved for
                        the operator
                      rule: '!self.exists(k, k.startsWith(''pgpilot.io/''))'
                  labels:
                    additionalProperties:
                      description: |-
                        LabelValue is the value of a Kubernetes label: empty, or at most 63
                        alphanumeric characters, '-', '_' or '.', starting and ending with an
                        alphanumeric character.
                      maxLength: 63
                      pattern: ^([A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?)?$
                      type: string
                    description: |-
                      labels to add on top of system-managed labels. Keys and values must
                      be valid Kubernetes label keys and values.
                    maxProperties: 32
                    type: object
                    x-kubernetes-validations:
                    - message: 'label keys must be valid Kubernetes label keys: an
                        optional lower-case DNS subdomain prefix and ''/'', then at
                        most 63 alphanumeric characters, ''-'', ''_'' or ''.'', starting
                        and ending with an alphanumeric character'
                      rule: self.all(k, k.matches('^([a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$')
                        && k.indexOf('/') <= 253)
                    - message: label keys under pgpilot.io/ are reserved for the operator
                      rule: '!self.exists(k, k.startsWith(''pgpilot.io/''))'
                type: object
              resources:
                description: |-
                  resources are the requests and limits of the pgwatch container. The
                  operator sets none of its own when this is left empty.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              serviceMetadata:
                description: |-
                  serviceMetadata extends labels and annotations on the generated
                  Service. Used for label-selector-based scrape configs and for
                  ServiceMonitor selection.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      annotations to add on top of system-managed annotations. Keys must be
                      valid Kubernetes annotation keys.
                    maxProperties: 64
                    type: object
                    x-kubernetes-validations:
                    - message: 'annotation keys must be valid Kubernetes annotation
                        keys: an optional DNS subdomain prefix and ''/'', then at
                        most 63 alphanumeric characters, ''-'', ''_'' or ''.'', starting
                        and ending with an alphanumeric character'
                      rule: self.all(k, k.matches('^([A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?([.][A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$')
                        && k.indexOf('/') <= 253)
                    - message: annotation keys under pgpilot.io/ are reserved for
                        the operator
                      rule: '!self.exists(k, k.startsWith(''pgpilot.io/''))'
                  labels:
                    additionalProperties:
                      description: |-
                        LabelValue is the value of a Kubernetes label: empty, or at most 63
                        alphanumeric characters, '-', '_' or '.', starting and ending with an
                        alphanumeric character.
                      maxLength: 63
                      pattern: ^([A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?)?$
                      type: string
                    description: |-
                      labels to add on top of system-managed labels. Keys and values must
                      be valid Kubernetes label keys and values.
                    maxProperties: 32
                    type: object
                    x-kubernetes-validations:
                    - message: 'label keys must be valid Kubernetes label keys: an
                        optional lower-case DNS subdomain prefix and ''/'', then at
                        most 63 alphanumeric characters, ''-'', ''_'' or ''.'', starting
                        and ending with an alphanumeric character'
                      rule: self.all(k, k.matches('^([a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$')
                        && k.indexOf('/') <= 253)
                    - message: label keys under pgpilot.io/ are reserved for the operator
                      rule: '!self.exists(k, k.startsWith(''pgpilot.io/''))'
                type: object
              sinks:
                description: |-
                  sinks configures where measurements go. At least one sink must be
                  enabled.
                properties:
                  grpc:
                    description: |-
                      grpc configures the push-based gRPC sink. pgpilot-operator does
                      not ship a receiver — this is a pass-through for users that run
                      their own, or for future pgpilot action-operators.
                    properties:
                      enabled:
                        default: false
                        description: enabled toggles the sink.
                        type: boolean
                      endpoint:
                        description: |-
                          endpoint is the host:port of the gRPC Receiver. Required when the
                          sink is enabled.
                        maxLength: 512
                        pattern: ^\S*$
                        type: string
                      tls:
                        description: |-
                          tls makes the collector connect to the Receiver with TLS. Without
                          it, or without a caSecretRef in it, the connection is plaintext.
                        properties:
                          caSecretRef:
                            description: |-
                              caSecretRef is the name of a Secret in the same namespace that
                              contains, under the key "ca.crt", the certificate authority the
                              Receiver's certificate has to be signed by. Naming it is what turns
                              TLS on: the collector then refuses a Receiver whose certificate that
                              authority did not sign, or that is not for the host in endpoint. The
                              pod mounts the Secret read-only and is replaced when it changes.

                              The field has no validation of its own: it was stored, and did
                              nothing, before it had a meaning, and a rule added now would refuse
                              writes to such monitors. The operator reports a value that is not
                              the name of a Secret.
                            type: string
                        type: object
                    required:
                    - enabled
                    type: object
                    x-kubernetes-validations:
