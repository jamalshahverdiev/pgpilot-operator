## Example NetworkPolicy for pgpilot-operator.
##
## This allows:
## 1. pgwatch monitor pods → target PostgreSQL databases (egress on port 5432)
## 2. Prometheus/vmagent → pgwatch monitor pods (ingress on port 9187; only
##    monitors with the Prometheus sink listen there)
## 3. Operator manager pod → Kubernetes API (egress on port 443)
##
## The operator never connects to a database, and a monitor pod never talks
## to the Kubernetes API. A monitor with the gRPC sink connects out to its
## receiver: add an egress rule for it (see the comment below), or the
## collector waits for the receiver, exits and is restarted for ever.
##
## Adapt the namespace selectors and pod selectors to your environment.

---
# Allow pgwatch monitor pods to reach PostgreSQL and expose metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgpilot-monitor-policy
  namespace: team-users
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pgpilot-monitor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus / vmagent scrape on metrics port
    - ports:
        - protocol: TCP
          port: 9187
  egress:
    # Allow connection to PostgreSQL
    - ports:
        - protocol: TCP
          port: 5432
    # With spec.sinks.grpc: allow the collector out to the receiver
    # - ports:
    #     - protocol: TCP
    #       port: <port of spec.sinks.grpc.endpoint>
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Allow operator manager to reach Kubernetes API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgpilot-operator-policy
  namespace: pgpilot-operator-system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
  policyTypes:
    - Egress
  egress:
    # Kubernetes API server
    - ports:
        - protocol: TCP
          port: 443
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
